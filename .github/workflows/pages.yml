name: Build and deploy Little Artist

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Django
        run: python -m pip install -r requirements.txt
      - name: Check Django project and tests
        run: |
          python manage.py check
          python manage.py test studio
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Render static website
        run: python build_pages.py --output _site --base-path "/${GITHUB_REPOSITORY#*/}/"
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
